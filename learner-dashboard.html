<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScholarAI | Learner Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-100 text-slate-800">

<div class="min-h-screen grid lg:grid-cols-[260px_1fr_320px] grid-cols-1 lg:grid-rows-[72px_1fr]">

<header class="lg:col-span-3 bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between">

<div>
<p class="text-xs uppercase tracking-wider text-emerald-700 font-semibold">
ScholarAI • Learner Portal
</p>

<h1 class="text-lg font-bold">
Learner Dashboard
</h1>
</div>

</header>

<aside class="hidden lg:block bg-slate-950 text-slate-100 p-4 space-y-2">

<a class="block px-3 py-2 rounded-lg bg-slate-800">Dashboard</a>
<a class="block px-3 py-2 rounded-lg hover:bg-slate-800">My Learning</a>
<a class="block px-3 py-2 rounded-lg hover:bg-slate-800">Assignments</a>
<a class="block px-3 py-2 rounded-lg hover:bg-slate-800">Practice Lab</a>

</aside>

<main class="p-4 space-y-6">

<section class="grid md:grid-cols-4 gap-3">

<div class="bg-white rounded-2xl border border-slate-200 p-4">
<p class="text-sm text-slate-500">Assignments</p>
<p class="text-2xl font-bold">6</p>
</div>

<div class="bg-white rounded-2xl border border-slate-200 p-4">
<p class="text-sm text-slate-500">Quiz Average</p>
<p class="text-2xl font-bold text-emerald-700">82%</p>
</div>

<div class="bg-white rounded-2xl border border-slate-200 p-4">
<p class="text-sm text-slate-500">Learning Streak</p>
<p class="text-2xl font-bold">11 days</p>
</div>

<div class="bg-white rounded-2xl border border-slate-200 p-4">
<p class="text-sm text-slate-500">Completion Rate</p>
<p class="text-2xl font-bold">76%</p>
</div>

</section>

<section class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">

<h3 class="text-lg font-bold">
AI Practice Lab
</h3>

<div class="grid md:grid-cols-5 gap-2 mt-3">

<select id="practiceGrade" class="border rounded-lg px-3 py-2"></select>

<select id="practiceSubject" class="border rounded-lg px-3 py-2"></select>

<select id="practiceStrand" class="border rounded-lg px-3 py-2"></select>

<select id="practiceSubStrand" class="border rounded-lg px-3 py-2"></select>

<select id="practiceDifficulty" class="border rounded-lg px-3 py-2">
<option>Easy</option>
<option selected>Medium</option>
<option>Hard</option>
</select>

</div>

<div class="flex gap-2 mt-3">

<button id="generatePracticeBtn"
class="px-4 py-2 rounded-lg bg-emerald-600 text-white">
Generate Practice
</button>

</div>

<div id="practiceOutput" class="mt-4"></div>

</section>

</main>

</div>

<script>

/* =========================
FULL CURRICULUM DATABASE
========================= */

const curriculum = {

Basic1:{
Mathematics:{
Numbers:[
{q:"What is 5 + 3?",a:"8"},
{q:"What is 10 - 4?",a:"6"}
],
Shapes:[
{q:"How many sides does a triangle have?",a:"3"}
]
},

English:{
Reading:[
{q:"What letter comes after B?",a:"C"},
{q:"Spell the word CAT.",a:"C-A-T"}
],
Grammar:[
{q:"Which word is a noun: dog, run, quickly?",a:"dog"}
]
},

Science:{
LivingThings:[
{q:"Name one living thing.",a:"Plant or animal"},
{q:"Which part of the plant grows underground?",a:"Root"}
]
}

},

/* ========================= */

Basic2:{
Mathematics:{
Numbers:[
{q:"What is 6 × 2?",a:"12"},
{q:"What is 15 ÷ 3?",a:"5"}
]
},

English:{
Grammar:[
{q:"Which word is a verb: jump, blue, table?",a:"jump"}
]
},

Science:{
Plants:[
{q:"What do plants need to grow?",a:"Water sunlight air"}
]
}

},

/* ========================= */

Basic3:{
Mathematics:{
Fractions:[
{q:"What is half of 10?",a:"5"}
]
},

Science:{
HumanBody:[
{q:"Which organ pumps blood?",a:"Heart"}
]
}

},

/* ========================= */

Basic4:{
Mathematics:{
Fractions:[
{q:"What is 1/2 + 1/2?",a:"1"}
]
},

Science:{
Energy:[
{q:"Name one source of energy.",a:"Sun"}
]
}

},

/* ========================= */

Basic5:{
Mathematics:{
Decimals:[
{q:"What is 0.5 + 0.5?",a:"1"}
]
},

Science:{
Matter:[
{q:"Name the three states of matter.",a:"Solid liquid gas"}
]
}

},

/* ========================= */

Basic6:{
Mathematics:{
Percentages:[
{q:"What is 50% of 20?",a:"10"}
]
},

Science:{
Electricity:[
{q:"What device stores electricity?",a:"Battery"}
]
}

},

/* ========================= */

Basic7:{
Mathematics:{
Algebra:[
{q:"Solve x + 5 = 10",a:"5"}
]
},

Science:{
Physics:[
{q:"What force pulls objects to Earth?",a:"Gravity"}
]
}

},

/* ========================= */

Basic8:{
Mathematics:{
Algebra:[
{q:"Solve 2x = 10",a:"5"}
]
},

Science:{
Biology:[
{q:"What organ helps us breathe?",a:"Lungs"}
]
}

},

/* ========================= */

Basic9:{
Mathematics:{
Algebra:[
{q:"Solve x² = 9",a:"3 or -3"}
]
},

Science:{
Chemistry:[
{q:"What is H2O?",a:"Water"}
]
}

}

};


/* =========================
SELECT ELEMENTS
========================= */

const gradeSelect=document.getElementById("practiceGrade");
const subjectSelect=document.getElementById("practiceSubject");
const strandSelect=document.getElementById("practiceStrand");
const topicSelect=document.getElementById("practiceSubStrand");


/* =========================
LOAD GRADES
========================= */

function loadGrades(){

gradeSelect.innerHTML="";

Object.keys(curriculum).forEach(grade=>{

let option=document.createElement("option");
option.value=grade;
option.textContent=grade;

gradeSelect.appendChild(option);

});

loadSubjects();
}


/* =========================
LOAD SUBJECTS
========================= */

function loadSubjects(){

subjectSelect.innerHTML="";
strandSelect.innerHTML="";
topicSelect.innerHTML="";

let subjects=curriculum[gradeSelect.value];

Object.keys(subjects).forEach(subject=>{

let option=document.createElement("option");
option.value=subject;
option.textContent=subject;

subjectSelect.appendChild(option);

});

loadStrands();

}


/* =========================
LOAD STRANDS
========================= */

function loadStrands(){

strandSelect.innerHTML="";
topicSelect.innerHTML="";

let strands=curriculum[gradeSelect.value][subjectSelect.value];

Object.keys(strands).forEach(strand=>{

let option=document.createElement("option");
option.value=strand;
option.textContent=strand;

strandSelect.appendChild(option);

});

loadTopics();

}


/* =========================
LOAD TOPICS
========================= */

function loadTopics(){

topicSelect.innerHTML="";

let topics=curriculum
[gradeSelect.value]
[subjectSelect.value]
[strandSelect.value];

topics.forEach((topic,i)=>{

let option=document.createElement("option");
option.value=i;
option.textContent="Question "+(i+1);

topicSelect.appendChild(option);

});

}


/* =========================
EVENT LISTENERS
========================= */

gradeSelect.addEventListener("change",loadSubjects);
subjectSelect.addEventListener("change",loadStrands);
strandSelect.addEventListener("change",loadTopics);

loadGrades();


/* =========================
QUIZ GENERATOR
========================= */

document
.getElementById("generatePracticeBtn")
.addEventListener("click",()=>{

let questionData=
curriculum
[gradeSelect.value]
[subjectSelect.value]
[strandSelect.value];

let output=document.getElementById("practiceOutput");

let html="";

questionData.forEach((item,i)=>{

html+=`

<div class="border rounded-xl p-3 mt-2">

<p class="font-semibold">
Q${i+1}: ${item.q}
</p>

<input class="border rounded w-full mt-2 px-3 py-2"
placeholder="Your answer">

</div>

`;

});

output.innerHTML=html;

});

</script>
</body>
</html>
